<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FixFlow Plumbing | Login</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<header class="header">
<div class="container nav-container">
<a class="logo" href="index.html">
<span class="logo-icon">
<i class="fa-solid fa-droplet"></i>
</span>
<span>
<strong>FixFlow</strong>
<small>PLUMBING</small>
</span>
</a>
<nav class="navbar">
<a href="index.html">Home</a>
<a href="product.html">Products</a>
<a href="services.html">Services</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>
<div class="header-buttons">
<a class="cart-btn" href="cart.html">
<i class="fa-solid fa-cart-shopping"></i>
                Cart
            </a>
<a class="login-btn" href="login.html">
<i class="fa-regular fa-user"></i>
                Log In
            </a>
</div>
</div>
</header>
<section class="login-section" id="login">
<div class="login-card">
<div class="login-logo">
<span>
<i class="fa-solid fa-droplet"></i>
</span>
<strong>FixFlow Plumbing</strong>
</div>
<span class="section-tag">CUSTOMER ACCOUNT</span>
<h2>Welcome Back</h2>
<p>
            Log in to your FixFlow Plumbing account.
        </p>
<form>
<label>Email Address</label>
<input placeholder="Enter your email" type="email"/>
<label>Password</label>
<input placeholder="Enter your password" type="password"/>
<div class="login-options">
<label>
<input type="checkbox"/>
                    Remember Me
                </label>
<a href="#">Forgot Password?</a>
</div>
<button class="login-submit" type="submit">
                Log In
            </button>
</form>
<div class="create-account">
            Don't have an account?
            <a href="#">Create Account</a>
</div>
</div>
</section>

</body>
</html>
